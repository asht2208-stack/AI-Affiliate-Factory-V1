[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the file_template's timestamp. Set explicitly so
# migration ordering is unambiguous across contributors in different
# timezones.
timezone = UTC

# Max length for the "slug" portion of migration filenames.
truncate_slug_length = 40

# We deliberately do NOT set sqlalchemy.url here. migrations/env.py
# pulls the real database URL from app.core.config.get_settings() at
# runtime, so the same settings/.env used by the application itself
# drive migrations too — there is exactly one source of truth for the
# database connection, never a second hardcoded copy that can drift
# out of sync with the real one.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

